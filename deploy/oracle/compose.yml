# /opt/maeum의 비공개 .env와 함께 사용한다. 공개 포트는 호스트 Caddy만 담당한다.
services:
  db:
    image: mariadb:11.4@sha256:250e1609e93c0e6aecf64bfbab2d84d5e89d2481540fe77447ff6c855c3b1873
    environment:
      MARIADB_DATABASE: support_portal
      MARIADB_USER: support_app
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB password required}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?root password required}
    command: ["--innodb-buffer-pool-size=48M", "--key-buffer-size=8M", "--max-connections=20", "--table-open-cache=200", "--performance-schema=OFF"]
    volumes: ["support-db:/var/lib/mysql"]
    mem_limit: 256m
    memswap_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  ocr:
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: ocr/Dockerfile
    environment:
      OCR_API_TOKEN: ${OCR_API_TOKEN:?OCR token required}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_TEXT_MODEL: ${OPENROUTER_TEXT_MODEL:-google/gemma-4-26b-a4b-it}
      AI_REQUESTS_PER_MINUTE: "6"
      AI_RATE_STATE_PATH: /var/cache/paddle/provider-budget.sqlite3
      OCR_CPU_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes: ["ocr-models:/var/cache/paddle"]
    mem_limit: 1400m
    memswap_limit: 3g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8091/health',headers={'Authorization':'Bearer '+os.environ['OCR_API_TOKEN']}),timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 45
      start_period: 600s
    logging: *logging
  app:
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile
    ports: ["127.0.0.1:8088:8080"]
    environment:
      JAVA_OPTS: "-Xms64m -Xmx192m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=32m -Xss256k -XX:ActiveProcessorCount=1 -XX:+UseSerialGC"
      DB_URL: jdbc:mariadb://db:3306/support_portal
      DB_USER: support_app
      DB_PASSWORD: ${DB_PASSWORD:?DB password required}
      LOCAL_SEED: "true"
      LOCAL_ACCOUNT_PASSWORD: Portfolio2026!
      FILE_ROOT: /var/lib/support/files
      FILE_MAX_BYTES: "536870912"
      FILE_MIN_FREE_BYTES: "1073741824"
      PUBLIC_DEMO_LOGIN: applicant
      DOCUMENT_PIPELINE_VERSION: pdfbox-3.0.8-paddle-v5-ko-layout-v2
      OCR_LIVE_ENABLED: "true"
      OCR_AI_ENABLED: ${OCR_AI_ENABLED:-false}
      OCR_API_URL: http://ocr:8091
      OCR_API_TOKEN: ${OCR_API_TOKEN:?OCR token required}
      OCR_DOCUMENT_TIMEOUT_SECONDS: "900"
      LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:?public operator required}
      LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:?public contact required}
      LEGAL_HOSTING_PROVIDER: "Oracle Corporation · Oracle Cloud Infrastructure, 대한민국 춘천 리전"
    volumes: ["support-files:/var/lib/support/files"]
    mem_limit: 480m
    memswap_limit: 1g
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      ocr: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/login"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 120s
    logging: *logging
volumes:
  support-db:
  support-files:
  ocr-models:
